speed_controller:
  ros__parameters:
    min_navigation_speed: 0.3
    max_navigation_speed: 0.8
    default_speed: 0.5
    crowded_speed: 0.3
    open_area_speed: 0.7
    crowded_density: 0.5
    slow_person_distance_m: 2.0
    # Conservative development default; calibrate for the target robot before deployment.
    stop_person_distance_m: 1.3
    slow_obstacle_distance_m: 1.5
    stop_obstacle_distance_m: 0.55
    clear_distance_hysteresis_m: 0.10
    lost_group_stop_sec: 8.0
    recovery_hold_sec: 2.0
    input_timeout_sec: 1.0
    acceleration_limit_mps2: 0.2
    deceleration_limit_mps2: 0.5
    min_speed_delta_mps: 0.05
    command_interval_sec: 0.5
    perception_control_latency_sec: 0.4
    person_stop_margin_m: 0.9
    person_slow_buffer_m: 0.5
    max_person_approach_speed_mps: 1.0
